[project]
name = "cryptodrift"
version = "0.1.0"
description = "Mechanistic Analysis of Cryptographic Security Degradation in Iterative LLM Code Refinement via MCP"
requires-python = ">=3.10"
dependencies = [
    # Model loading + inference
    "torch>=2.1.0",
    "transformers>=4.43.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.27.0",

    # UI
    "PyQt6>=6.6.0",
    "pyqtgraph>=0.13.0",

    # Analysis
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "radon>=6.0.0",

    # Supplementary static analysis
    "bandit>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
]

[project.scripts]
cryptodrift = "src.ui.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
